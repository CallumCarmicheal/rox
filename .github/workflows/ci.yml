# Checks every PR on Linux: fmt, clippy, tests. Pushes to main run the same job
# so the default-branch build cache stays warm, which is what PR runs restore
# from; a cold build compiles the whole vendored gpui tree.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # cmake is here for rox-milkdrop-sys, which builds libprojectM from
      # source. The GitHub images already ship it; the line documents the need.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libasound2-dev libfontconfig1-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-dev libxcb1-dev libvulkan-dev \
            libssl-dev cmake

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # vendor/ rides along in the cache so its mtimes survive between runs:
      # a freshly re-extracted vendor tree looks dirty to cargo's fingerprints
      # and forces a full gpui rebuild even when nothing changed.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: vendor

      # vendor/ is gitignored; [patch.crates-io] points at it, so rebuild it
      # from crates.io + patches/ before anything compiles.
      - name: Vendor patched crates
        run: scripts/vendor-gpui.sh

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Tests
        run: cargo test --workspace
